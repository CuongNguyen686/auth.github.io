<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>api-key-manager — Key Server</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#273244;background:#fff7fb}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.app{min-height:100vh;display:flex}.sidebar{width:270px;flex:0 0 270px;background:#fff;border-right:1px solid #f7dce9;display:flex;flex-direction:column;min-height:100vh}
.brand{height:112px;display:flex;align-items:center;gap:14px;padding:24px;border-bottom:1px solid #f7dce9}.logo{width:54px;height:54px;border-radius:15px;background:#f72591;color:#fff;display:grid;place-items:center;box-shadow:0 7px 18px #fbcfe8}.brand b{font-size:22px}.brand small{display:block;color:#9ca3af;font-size:11px;margin-top:3px}
.nav{padding:25px 18px;display:grid;gap:7px}.nav button{border:0;background:transparent;text-align:left;color:#6b7280;padding:15px 16px;border-radius:16px;font-weight:600;font-size:16px;display:flex;align-items:center;gap:14px}.nav button:hover{background:#fff0f7;color:#e91e82}.nav button.active{background:#f72591;color:white;box-shadow:0 8px 20px #fbcfe8}.ico{width:22px;text-align:center;font-size:20px}
.main{flex:1;min-width:0;padding:42px 54px}.head{margin-bottom:28px}.head h1{font-size:34px;margin:0 0 7px}.head p{font-size:17px;color:#9ca3af;margin:0}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;margin-bottom:24px}.stat{background:#fff;border:1px solid #f5d6e5;border-radius:22px;padding:25px;box-shadow:0 4px 14px rgba(236,72,153,.05)}.stat .si{width:54px;height:54px;background:#fff1f7;color:#f72591;border-radius:14px;display:grid;place-items:center;font-size:25px;margin-bottom:23px}.stat .n{font-size:34px;font-weight:800}.stat .l{font-size:16px;color:#9ca3af;margin-top:3px}
.card{background:#fff;border:1px solid #f5d6e5;border-radius:20px;padding:22px;box-shadow:0 4px 14px rgba(236,72,153,.04)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:24px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.title{font-size:16px;font-weight:750;margin:0 0 16px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.btn{border:1px solid #f4c7db;background:#fff;color:#d91d78;padding:9px 13px;border-radius:10px;font-size:13px;font-weight:650}.btn:hover{background:#fff1f7}.btn.primary{background:#f72591;border-color:#f72591;color:#fff}.btn.danger{color:#e11d48;border-color:#fecdd3}.btn.gray{color:#6b7280;border-color:#e5e7eb}.actions{display:flex;gap:7px;flex-wrap:wrap}
.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:13px}.table th{text-align:left;color:#9ca3af;font-size:11px;padding:10px 8px;border-bottom:1px solid #f7dce9;white-space:nowrap}.table td{padding:11px 8px;border-bottom:1px solid #fff0f7;vertical-align:middle}.table tr:last-child td{border-bottom:0}
.badge{display:inline-flex;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:700;border:1px solid #e5e7eb}.green{background:#ecfdf5;color:#047857;border-color:#a7f3d0}.rose{background:#fff1f2;color:#be123c;border-color:#fecdd3}.amber{background:#fffbeb;color:#b45309;border-color:#fde68a}.pink{background:#fdf2f8;color:#be185d;border-color:#fbcfe8}.gray{background:#f9fafb;color:#6b7280}
.copy{border:1px solid #fbcfe8;background:#fdf2f8;color:#be185d;padding:5px 8px;border-radius:8px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.input{width:100%;border:1px solid #f0c9db;background:#fff;border-radius:10px;padding:10px 11px;outline:0;color:#273244}.input:focus{border-color:#f472b6;box-shadow:0 0 0 3px #fce7f3}.field{margin-bottom:14px}.field label{display:block;font-size:11px;color:#6b7280;font-weight:700;margin-bottom:6px}.form2{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}.toggle{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid #fff0f7;font-size:13px}.switch{width:43px;height:24px;border:0;border-radius:99px;background:#e5e7eb;padding:2px}.switch i{display:block;width:20px;height:20px;background:#fff;border-radius:50%;transition:.15s;box-shadow:0 1px 3px #aaa}.switch.on{background:#f72591}.switch.on i{transform:translateX(19px)}
.empty{padding:45px;text-align:center;color:#9ca3af;border:2px dashed #f7dce9;border-radius:15px}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.muted{color:#9ca3af;font-size:12px}.pre{background:#111827;color:#fce7f3;border-radius:12px;padding:15px;white-space:pre-wrap;word-break:break-word;overflow:auto;font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace}
.modal{position:fixed;inset:0;background:rgba(17,24,39,.38);z-index:30;display:grid;place-items:center;padding:18px}.modalbox{background:#fff;width:min(700px,100%);max-height:92vh;overflow:auto;border-radius:20px;box-shadow:0 25px 80px rgba(0,0,0,.2)}.mh{padding:16px 20px;border-bottom:1px solid #f7dce9;display:flex;justify-content:space-between;align-items:center}.mb{padding:20px}.close{border:0;background:transparent;color:#9ca3af;font-size:25px}
.toast{position:fixed;right:22px;bottom:22px;background:#111827;color:#fff;border-radius:10px;padding:11px 15px;font-size:13px;z-index:100;box-shadow:0 10px 30px #0003}.status{position:fixed;right:18px;top:16px;font-size:11px;background:#fff;border:1px solid #f5d6e5;border-radius:999px;padding:6px 9px;color:#9ca3af;z-index:10}.status.ok{color:#047857}.status.bad{color:#be123c}
.barbox{display:grid;gap:10px}.barrow{display:grid;grid-template-columns:110px 1fr 45px;gap:8px;align-items:center;font-size:11px;color:#6b7280}.bar{height:13px;background:#fde7f1;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#f72591;border-radius:99px}.notice{padding:12px 14px;background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:10px;font-size:12px}.okbox{padding:12px 14px;background:#ecfdf5;border:1px solid #a7f3d0;color:#047857;border-radius:10px;font-size:12px}
@media(max-width:1050px){.cards{grid-template-columns:1fr 1fr}.main{padding:30px}.sidebar{width:235px;flex-basis:235px}.grid2{grid-template-columns:1fr}}
@media(max-width:700px){.app{display:block}.sidebar{width:100%;min-height:auto}.brand{height:auto}.nav{grid-template-columns:1fr 1fr;padding:12px}.nav button{font-size:13px;padding:11px}.main{padding:18px}.cards{grid-template-columns:1fr 1fr;gap:12px}.stat{padding:16px}.stat .n{font-size:25px}.stat .si{margin-bottom:12px}.form2{grid-template-columns:1fr}.head h1{font-size:27px}}
</style>
</head>
<body>
<div id="app"><div class="app"><aside class="sidebar"><div class="brand"><div class="logo">⚿</div><div><b>Key Server</b><small>api-key-manager</small></div></div><nav class="nav"><button class="active"><span class="ico">▦</span>Trang chủ</button><button><span class="ico">▣</span>Quản lý Package</button><button><span class="ico">⚿</span>Quản lý Key</button><button><span class="ico">ⓘ</span>Gói đang sử dụng</button><button><span class="ico">▤</span>Tài liệu &amp; Tích hợp</button></nav></aside><main class="main"><div class="head"><h1>Trang chủ</h1><p>Tổng quan sử dụng key và danh sách cấm</p></div><div class="cards"><div class="stat"><div class="si">▣</div><div class="n">0</div><div class="l">Package</div></div><div class="stat"><div class="si">⚿</div><div class="n">0</div><div class="l">Tổng key</div></div><div class="stat"><div class="si">⊘</div><div class="n">0</div><div class="l">Key bị ban</div></div><div class="stat"><div class="si">▣</div><div class="n">0</div><div class="l">Thiết bị bị ban</div></div></div><div class="card"><h3 class="title">Key Server</h3><div class="okbox">Trang chủ đã tải. Đang đồng bộ Firebase ở phía sau…</div></div></main></div></div>
<script>
"use strict";

/* ================= FIREBASE CONFIG — ĐÃ ĐIỀN ================= */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBcFSLEz5XN8bg61coRU43yTj3_cTwZDbc",
  authDomain: "apiseverkey-a1436.firebaseapp.com",
  databaseURL: "https://apiseverkey-a1436-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "apiseverkey-a1436",
  storageBucket: "apiseverkey-a1436.firebasestorage.app",
  messagingSenderId: "350777229577",
  appId: "1:350777229577:web:76fef9ba881001e60193d8",
  measurementId: "G-1RJ7F5Q7NN"
};
/* Database hiện tại được giữ nguyên: /app-data */
const DB_URL = FIREBASE_CONFIG.databaseURL;
let auth = {idToken:null, refreshToken:null, expiresAt:0};
let state = {packages:[],keys:[],bannedDevices:[]};
let currentTab = "dashboard";
let toastTimer = null;

const DURATIONS = [
  ["1d","1 ngày",86400000],["3d","3 ngày",259200000],["7d","7 ngày",604800000],
  ["1th","1 tháng",2592000000],["3th","3 tháng",7776000000],["1nam","1 năm",31536000000]
];
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Math.random().toString(36).slice(2,10);
const rand = n => Array.from({length:n},()=> "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"[Math.floor(Math.random()*32)]).join("");
const genKey = () => `PK-${rand(4)}-${rand(4)}-${rand(4)}`;
const genToken = () => `tok_${(rand(8)+rand(8)).toLowerCase()}`;
const fmt = ts => ts ? new Date(ts).toLocaleDateString("vi-VN",{day:"2-digit",month:"2-digit",year:"numeric"}) : "—";
const left = ts => {const d=(Number(ts)||0)-Date.now(); if(d<=0)return {label:"Hết hạn",expired:true}; const days=Math.floor(d/86400000),h=Math.floor(d%86400000/3600000);return {label:days?`còn ${days} ngày`:`còn ${h} giờ`,expired:false}};
function toast(msg){clearTimeout(toastTimer);const x=document.createElement("div");x.className="toast";x.textContent=msg;document.body.appendChild(x);toastTimer=setTimeout(()=>x.remove(),2400)}
function copy(v){navigator.clipboard?.writeText(v).then(()=>toast("Đã sao chép")).catch(()=>toast("Không thể sao chép"))}
function badge(t,c="pink"){return `<span class="badge ${c}">${esc(t)}</span>`}
function info(label,value){return `<div><div class="muted">${esc(label)}</div><b>${esc(value)}</b></div>`}

async function firebaseLoad(){
  const r = await fetch(`${DB_URL}/app-data.json`, {
    method:"GET",
    headers:{"Accept":"application/json"}
  });
  const text = await r.text();
  let d = null;
  try { d = text ? JSON.parse(text) : null; } catch(e) {}

  if(!r.ok){
    const detail = d?.error || text || `HTTP ${r.status}`;
    throw Error(`Firebase HTTP ${r.status}: ${detail}`);
  }
  if(d === null || typeof d !== "object"){
    return {};
  }
  return d;
}

let saveTimer;
function scheduleSave(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    try{
      const r=await fetch(`${DB_URL}/app-data.json`,{
        method:"PUT",
        headers:{
          "Content-Type":"application/json",
          "Accept":"application/json"
        },
        body:JSON.stringify(state)
      });
      const text=await r.text();
      let d=null;
      try{d=text?JSON.parse(text):null}catch(e){}

      if(!r.ok){
        const detail=d?.error||text||`HTTP ${r.status}`;
        throw Error(`Firebase HTTP ${r.status}: ${detail}`);
      }

      setStatus(true,"Firebase đã lưu");
    }catch(e){
      setStatus(false,"Firebase lỗi");
      toast("Lưu Firebase lỗi: "+e.message);
      console.error("Firebase write error:",e);
    }
  },250);
}

function setStatus(ok,msg){const x=$(".status");if(x){x.className="status "+(ok?"ok":"bad");x.textContent=msg}}
async function syncFromFirebase(show=true){
  try{
    const d=await firebaseLoad();
    state={packages:Array.isArray(d.packages)?d.packages:[],keys:Array.isArray(d.keys)?d.keys:[],bannedDevices:Array.isArray(d.bannedDevices)?d.bannedDevices:[]};
    render();setStatus(true,"Firebase đã kết nối");if(show)toast("Đã làm mới dữ liệu");
  }catch(e){setStatus(false,"Firebase chưa kết nối");if(show)toast("Không đọc được Firebase: "+e.message)}
}
function mutate(fn,msg){fn();render();scheduleSave();if(msg)toast(msg)}

function shell(){
  const nav=[
    ["dashboard","▦","Trang chủ"],["packages","▣","Quản lý Package"],["keys","⚿","Quản lý Key"],
    ["usage","ⓘ","Gói đang sử dụng"],["docs","▤","Tài liệu & Tích hợp"]
  ];
  return `<div class="app"><aside class="sidebar">
    <div class="brand"><div class="logo">⚿</div><div><b>Key Server</b><small>api-key-manager</small></div></div>
    <nav class="nav">${nav.map(n=>`<button class="${currentTab===n[0]?"active":""}" onclick="go('${n[0]}')"><span class="ico">${n[1]}</span>${n[2]}</button>`).join("")}</nav>
  </aside><main class="main"><div class="status">Đang tải dữ liệu…</div><div id="view"></div></main></div>`;
}
function render(){document.getElementById("app").innerHTML=shell();const v=$("#view");if(currentTab==="dashboard")v.innerHTML=dashboard();if(currentTab==="packages")v.innerHTML=packages();if(currentTab==="keys")v.innerHTML=keys();if(currentTab==="usage")v.innerHTML=usage();if(currentTab==="docs")v.innerHTML=docs();}

function dashboard(){
  const bannedKeys=state.keys.filter(k=>k.banned), active=state.keys.filter(k=>!k.banned&&!left(k.expiresAt).expired);
  const rows=state.packages.map(p=>{const ks=state.keys.filter(k=>k.packageId===p.id),used=ks.reduce((s,k)=>s+(Number(k.usedCount)||0),0),max=ks.reduce((s,k)=>s+(Number(k.maxUses)||0),0);return {p,used,max,remain:Math.max(max-used,0)}})
  const max=Math.max(...rows.map(x=>x.used+x.remain),1);
  return `<div class="head"><h1>Trang chủ</h1><p>Tổng quan sử dụng key và danh sách cấm</p></div>
  <div class="cards">
    ${stat("Package",state.packages.length,"▣")}
    ${stat("Tổng key",state.keys.length,"⚿")}
    ${stat("Key bị ban",bannedKeys.length,"⊘","rose")}
    ${stat("Thiết bị bị ban",state.bannedDevices.length,"▣","rose")}
  </div>
  <div class="card" style="margin-bottom:24px"><h3 class="title">Sơ đồ lượt key đã sử dụng theo package</h3>
    ${rows.length?`<div class="barbox">${rows.map(x=>`<div class="barrow"><span>${esc(x.p.name)}</span><div class="bar"><i style="width:${Math.min(100,x.used/max*100)}%"></i></div><b>${x.used}</b></div>`).join("")}</div>`:`<div class="empty">Chưa có package nào để hiển thị.</div>`}
  </div>
  <div class="grid2">
    <div class="card"><h3 class="title">Key đã ban</h3>${bannedKeys.length?bannedKeys.map(k=>`<div style="display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #fff0f7"><span class="mono" style="font-size:11px">${esc(k.value)}</span><button class="btn" onclick="toggleBan('${k.id}')">Bỏ ban</button></div>`).join(""):`<div class="empty">Chưa có key nào bị ban.</div>`}</div>
    <div class="card"><h3 class="title">Ban UID / thiết bị</h3><div style="display:flex;gap:8px;margin-bottom:12px"><input id="banUid" class="input" placeholder="Nhập UID thiết bị…"><button class="btn danger" onclick="banUid()">Ban</button></div>${state.bannedDevices.length?state.bannedDevices.map(d=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #fff0f7"><span class="mono" style="font-size:11px">${esc(d)}</span><button class="btn" onclick="unbanUid('${esc(d)}')">Bỏ ban</button></div>`).join(""):`<div class="muted">Chưa có thiết bị nào bị ban.</div>`}</div>
  </div>`;
}
function stat(label,n,icon,tone="pink"){return `<div class="stat"><div class="si ${tone==="rose"?"rose":""}">${icon}</div><div class="n">${n}</div><div class="l">${label}</div></div>`}

const emptyForm={name:"",description:"",keyName:"",version:"1.0.0",status:"active",allowFreeLogin:false,getRealUidIOS:false,contactLink:"",updateLink:"",notifyMessage:""};
let editingPkg=null;
function packages(){
  return `<div class="head"><div class="toolbar"><div><h1>Quản lý Package</h1><p>Tạo và cấu hình các package dev cho ứng dụng của bạn</p></div><button class="btn primary" onclick="openPackageForm()">＋ Tạo package</button></div></div>
  ${editingPkg?packageForm():state.packages.length?`<div class="grid2">${state.packages.map(p=>packageCard(p)).join("")}</div>`:`<div class="empty">Chưa có package nào. Tạo package đầu tiên để bắt đầu.</div>`}`;
}
function packageForm(){
  const p=editingPkg?.id?editingPkg:emptyForm,f=editingPkg?.id?editingPkg:emptyForm;
  return `<div class="card" style="margin-bottom:20px"><div class="toolbar"><h3 class="title" style="margin:0">${editingPkg?.id?"Tuỳ chỉnh thông tin package":"Tạo package mới"}</h3><button class="btn gray" onclick="closePackageForm()">Đóng</button></div>
  <div class="form2">${field("Tên package","pf_name",f.name,"VD: App Pro Package")}${field("Tên key","pf_keyName",f.keyName,"VD: PRO-KEY")}${field("Mô tả","pf_description",f.description,"Mô tả package…")}${field("Version","pf_version",f.version,"1.0.0")}${select("Trạng thái","pf_status",f.status,[["active","Đang hoạt động"],["maintenance","Bảo trì"]])}${field("Link liên hệ","pf_contactLink",f.contactLink,"https://…")}${field("Link cập nhật app","pf_updateLink",f.updateLink,"https://…")}${field("Thông báo","pf_notifyMessage",f.notifyMessage,"Thông báo đến người dùng key")}</div>
  ${toggle("pf_free","Cho phép đăng nhập key miễn phí",!!f.allowFreeLogin)}${toggle("pf_ios","Lấy UID thật từ iOS",!!f.getRealUidIOS)}
  <div class="actions" style="justify-content:flex-end;margin-top:15px"><button class="btn" onclick="closePackageForm()">Huỷ</button><button class="btn primary" onclick="savePackage()">${editingPkg?.id?"Hoàn thành":"Tạo package"}</button></div></div>`;
}
function field(label,id,value,ph){return `<div class="field"><label>${label}</label><input id="${id}" class="input" value="${esc(value)}" placeholder="${esc(ph||"")}"></div>`}
function select(label,id,value,opts){return `<div class="field"><label>${label}</label><select id="${id}" class="input">${opts.map(o=>`<option value="${o[0]}" ${o[0]===value?"selected":""}>${o[1]}</option>`).join("")}</select></div>`}
function toggle(id,label,on){return `<div class="toggle"><span>${label}</span><button id="${id}" class="switch ${on?"on":""}" onclick="this.classList.toggle('on')"><i></i></button></div>`}
function packageCard(p){
  const ks=state.keys.filter(k=>k.packageId===p.id),uids=ks.filter(k=>k.uid);
  return `<div class="card"><div class="toolbar"><div><h3 class="title" style="margin:0">${esc(p.name)}</h3><div class="muted">Tạo ngày ${fmt(p.createdAt)}</div></div>${p.status==="active"?badge("Đang hoạt động","green"):badge("Bảo trì","amber")}</div>
  ${p.description?`<p style="font-size:13px;color:#6b7280">${esc(p.description)}</p>`:""}
  <div class="actions" style="margin:12px 0">${badge("v"+p.version,"gray")}${badge(ks.length+" key","pink")}${p.allowFreeLogin?badge("Free login","gray"):""}${p.getRealUidIOS?badge("UID iOS thật","gray"):""}</div>
  <div class="muted">API Key package</div><button class="copy" onclick="copy('${esc(p.apiKey||"")}')">${esc(p.apiKey||"—")}</button>
  <div class="muted" style="margin-top:8px">Token package</div><button class="copy" onclick="copy('${esc(p.token||"")}')">${esc(p.token||"—")}</button>
  <p class="muted">UID đã nhập key: <b>${uids.length}</b></p>
  <div class="actions" style="padding-top:12px;border-top:1px solid #fff0f7"><button class="btn" onclick="editPackage('${p.id}')">⚙ Tuỳ chỉnh</button><button class="btn" onclick="resetPackage('${p.id}')">↻ Reset all key</button><button class="btn danger" onclick="deletePackage('${p.id}')">Xoá package</button></div></div>`;
}
function openPackageForm(){editingPkg={...emptyForm};render()}
function editPackage(id){editingPkg={...state.packages.find(p=>p.id===id)};render()}
function closePackageForm(){editingPkg=null;render()}
function savePackage(){
  const f={name:$("#pf_name").value.trim(),keyName:$("#pf_keyName").value.trim(),description:$("#pf_description").value.trim(),version:$("#pf_version").value.trim()||"1.0.0",status:$("#pf_status").value,contactLink:$("#pf_contactLink").value.trim(),updateLink:$("#pf_updateLink").value.trim(),notifyMessage:$("#pf_notifyMessage").value.trim(),allowFreeLogin:$("#pf_free").classList.contains("on"),getRealUidIOS:$("#pf_ios").classList.contains("on")};
  if(!f.name)return toast("Vui lòng nhập tên package");
  if(editingPkg.id){mutate(()=>{state.packages=state.packages.map(p=>p.id===editingPkg.id?{...p,...f}:p)},"Đã lưu package")}
  else{mutate(()=>state.packages.unshift({...f,id:uid(),apiKey:genKey(),token:genToken(),createdAt:Date.now()}),"Đã tạo package")}
  editingPkg=null;render();
}
function resetPackage(id){if(!confirm("Reset toàn bộ key của package này?"))return;mutate(()=>state.keys=state.keys.map(k=>k.packageId===id?{...k,usedCount:0,uid:null,banned:false}:k),"Đã reset all key")}
function deletePackage(id){const p=state.packages.find(x=>x.id===id);if(!confirm(`Xoá package "${p?.name}" và toàn bộ key liên quan?`))return;mutate(()=>{state.packages=state.packages.filter(x=>x.id!==id);state.keys=state.keys.filter(x=>x.packageId!==id)},"Đã xoá package")}

let keySearch="",keyDetail=null;
function keys(){
  const list=state.keys.filter(k=>[k.name,k.value,k.uid,k.note,state.packages.find(p=>p.id===k.packageId)?.name].join(" ").toLowerCase().includes(keySearch.toLowerCase()));
  return `<div class="head"><div class="toolbar"><div><h1>Quản lý Key</h1><p>Tạo nhanh và theo dõi các key đã phát hành</p></div><button class="btn danger" onclick="clearKeys()">♻ Dọn key</button></div></div>
  <div class="card" style="margin-bottom:20px"><h3 class="title">Tạo key nhanh</h3><div class="form2">${select("Chọn package","kf_pkg",state.packages[0]?.id||"",state.packages.map(p=>[p.id,p.name]))}${field("Lượt nhập key","kf_uses","1","1")}</div><div class="field"><label>Thời hạn</label><div class="actions">${DURATIONS.map(d=>`<button class="btn ${d[0]==="7d"?"primary":""}" onclick="createKey('${d[0]}')">${d[1]}</button>`).join("")}</div></div></div>
  <div class="card"><div class="toolbar"><h3 class="title" style="margin:0">Danh sách key đã tạo (${list.length})</h3><input id="keySearch" class="input" style="max-width:270px" value="${esc(keySearch)}" placeholder="Tìm theo key, UID, package…" oninput="keySearch=this.value;render();setTimeout(()=>{let x=$('#keySearch');x?.focus();x?.setSelectionRange(x.value.length,x.value.length)},0)"></div>
  ${list.length?`<div class="tablewrap"><table class="table"><tr><th>Tên</th><th>Key</th><th>Package</th><th>Lượt nhập</th><th>Tạo</th><th>Thời hạn</th><th>Trạng thái</th><th></th></tr>${list.map(k=>{const p=state.packages.find(x=>x.id===k.packageId),tl=left(k.expiresAt);return `<tr><td><b>${esc(k.name)}</b>${k.messages?.length?`<div>${badge(k.messages.length+" tin nhắn","pink")}</div>`:""}</td><td><button class="copy" onclick="copy('${esc(k.value)}')">${esc(k.value)}</button></td><td>${esc(p?.name||"—")}</td><td>${k.usedCount||0}/${k.maxUses||0}</td><td>${fmt(k.createdAt)}</td><td>${badge(tl.label,tl.expired?"rose":"gray")}</td><td>${k.banned?badge("Đã ban","rose"):badge("Hoạt động","green")}</td><td><div class="actions"><button class="btn" onclick="openKey('${k.id}')">Chi tiết</button><button class="btn" onclick="toggleBan('${k.id}')">${k.banned?"Bỏ ban":"Ban"}</button><button class="btn danger" onclick="deleteKey('${k.id}')">Xoá</button></div></td></tr>`}).join("")}</table></div>`:`<div class="empty">Không có key nào.</div>`}</div>
  ${keyDetail?keyModal(state.keys.find(k=>k.id===keyDetail)): ""}`;
}
function createKey(duration){
  const pkg=$("#kf_pkg")?.value,uses=Math.max(1,Number($("#kf_uses")?.value)||1),d=DURATIONS.find(x=>x[0]===duration),p=state.packages.find(x=>x.id===pkg);
  if(!p)return toast("Vui lòng tạo package trước");
  mutate(()=>state.keys.unshift({id:uid(),packageId:pkg,name:`KEY-${rand(4)}`,value:genKey(),maxUses:uses,usedCount:0,createdAt:Date.now(),expiresAt:Date.now()+d[2],uid:null,banned:false,note:"",messages:[]}),"Đã tạo key");
}
function clearKeys(){if(!confirm("Xoá toàn bộ key? Hành động không thể hoàn tác."))return;mutate(()=>state.keys=[],"Đã dọn toàn bộ key")}
function toggleBan(id){mutate(()=>state.keys=state.keys.map(k=>k.id===id?{...k,banned:!k.banned}:k), "Đã cập nhật trạng thái key")}
function deleteKey(id){if(!confirm("Xoá key này?"))return;mutate(()=>state.keys=state.keys.filter(k=>k.id!==id),"Đã xoá key")}
function openKey(id){keyDetail=id;render()}
function keyModal(k){
  if(!k)return "";
  const p=state.packages.find(x=>x.id===k.packageId),tl=left(k.expiresAt);
  return `<div class="modal" onclick="if(event.target===this)closeKey()"><div class="modalbox"><div class="mh"><div><b>${esc(k.name)}</b> ${k.banned?badge("Đã ban","rose"):badge(tl.label,tl.expired?"rose":"green")}<div class="muted">${esc(p?.name||"—")} · ${esc(k.value)}</div></div><button class="close" onclick="closeKey()">×</button></div><div class="mb"><div class="grid3">${info("UID đã nhập",k.uid||"Chưa có")}${info("Lượt dùng",`${k.usedCount||0}/${k.maxUses||0}`)}${info("Tạo ngày",fmt(k.createdAt))}</div>
  <div class="field" style="margin-top:20px"><label>Thông tin tuỳ chỉnh cho key</label><textarea id="kd_note" class="input" rows="3">${esc(k.note||"")}</textarea></div><div class="actions" style="justify-content:flex-end"><button class="btn primary" onclick="saveNote('${k.id}')">Lưu thông tin</button></div>
  <div class="field" style="margin-top:18px"><label>UID thiết bị để mô phỏng nhập key</label><input id="kd_uid" class="input" value="${esc(k.uid||"")}" placeholder="UID"></div><button class="btn" onclick="setUid('${k.id}')">Lưu UID / cộng 1 lượt</button>
  <hr style="border:0;border-top:1px solid #f7dce9;margin:20px 0"><label class="field"><span class="field"><label>Gửi tin nhắn đến người dùng key</label><div style="display:flex;gap:8px"><input id="kd_msg" class="input" placeholder="Nhập nội dung tin nhắn…"><button class="btn primary" onclick="sendMsg('${k.id}')">Gửi</button></div></label>
  <div style="margin-top:12px">${(k.messages||[]).length?[...(k.messages||[])].reverse().map(m=>`<div style="padding:9px;background:#fdf2f8;border:1px solid #fbcfe8;border-radius:9px;margin:6px 0"><div style="font-size:13px;color:#be185d">${esc(m.text)}</div><div class="muted">${new Date(m.sentAt).toLocaleString("vi-VN")}</div></div>`).join(""):`<div class="muted">Chưa có tin nhắn nào.</div>`}</div></div></div></div>`;
}
function closeKey(){keyDetail=null;render()}
function saveNote(id){mutate(()=>state.keys=state.keys.map(k=>k.id===id?{...k,note:$("#kd_note").value}:k),"Đã lưu thông tin")}
function setUid(id){const v=$("#kd_uid").value.trim();mutate(()=>state.keys=state.keys.map(k=>k.id===id?{...k,uid:v,usedCount:v?Math.min(k.maxUses,k.usedCount+1):k.usedCount}:k),"Đã cập nhật UID");keyDetail=id;render()}
function sendMsg(id){const v=$("#kd_msg").value.trim();if(!v)return;mutate(()=>state.keys=state.keys.map(k=>k.id===id?{...k,messages:[...(k.messages||[]),{text:v,sentAt:Date.now()}]}:k),"Đã gửi tin nhắn");keyDetail=id;render()}

function usage(){
  const p=state.packages[0];if(!p)return `<div class="head"><h1>Gói đang sử dụng</h1><p>Chi tiết package hiện đang hoạt động chính</p></div><div class="empty">Chưa có package nào được tạo.</div>`;
  const ks=state.keys.filter(k=>k.packageId===p.id),active=ks.filter(k=>!left(k.expiresAt).expired&&!k.banned);
  return `<div class="head"><h1>Gói đang sử dụng</h1><p>Chi tiết package hiện đang hoạt động chính</p></div><div class="card" style="max-width:760px"><div class="toolbar"><h2 style="margin:0">${esc(p.name)}</h2>${p.status==="active"?badge("Đang hoạt động","green"):badge("Bảo trì","amber")}</div><p style="color:#6b7280">${esc(p.description||"Không có mô tả.")}</p><div class="grid2" style="margin:20px 0">${info("Version","v"+p.version)}${info("Ngày tạo",fmt(p.createdAt))}${info("Tổng key",ks.length)}${info("Key còn hoạt động",active.length)}${info("Free login",p.allowFreeLogin?"Bật":"Tắt")}${info("UID thật iOS",p.getRealUidIOS?"Bật":"Tắt")}</div><div class="field"><label>API Key</label><button class="copy" onclick="copy('${esc(p.apiKey||"")}')">${esc(p.apiKey||"—")}</button></div><div class="field"><label>Token</label><button class="copy" onclick="copy('${esc(p.token||"")}')">${esc(p.token||"—")}</button></div>${p.contactLink?`<p class="muted">Liên hệ: <a href="${esc(p.contactLink)}" target="_blank">${esc(p.contactLink)}</a></p>`:""}${p.updateLink?`<p class="muted">Cập nhật: <a href="${esc(p.updateLink)}" target="_blank">${esc(p.updateLink)}</a></p>`:""}${p.notifyMessage?`<div class="notice">📢 ${esc(p.notifyMessage)}</div>`:""}</div>`;
}
function docs(){
  const p=state.packages[0];
  const snippet=`POST https://api.yourserver.dev/v1/verify
Authorization: Bearer ${p?.apiKey||"<API_KEY>"}
Content-Type: application/json

{
  "key": "<KEY_NGUOI_DUNG_NHAP>",
  "uid": "<UID_THIET_BI>"
}

200 → key hợp lệ
403 → key sai / hết hạn / bị ban
423 → package bảo trì`;
  return `<div class="head"><h1>Tài liệu & Tích hợp API</h1><p>Hai bước để gắn hệ thống key vào ứng dụng của bạn</p></div><div style="max-width:850px;display:grid;gap:20px"><div class="card"><h3 class="title">1. Firebase / Database Config</h3><div class="pre">${esc(JSON.stringify(FIREBASE_CONFIG,null,2))}</div><div class="okbox" style="margin-top:12px">Database giữ nguyên node <b>/app-data</b>. HTML này dùng Firebase REST trực tiếp tại /app-data, không dùng Authentication.</div></div><div class="card"><h3 class="title">2. Gắn key vào app</h3><pre class="pre">${esc(snippet)}</pre></div></div>`;
}

function banUid(){const v=$("#banUid").value.trim();if(!v)return toast("Nhập UID trước");if(state.bannedDevices.includes(v))return toast("UID này đã bị ban");mutate(()=>state.bannedDevices.push(v),"Đã ban thiết bị")}
function unbanUid(d){mutate(()=>state.bannedDevices=state.bannedDevices.filter(x=>x!==d),"Đã bỏ ban thiết bị")}
function go(t){currentTab=t;keyDetail=null;editingPkg=null;render()}
window.go=go;window.copy=copy;window.openPackageForm=openPackageForm;window.closePackageForm=closePackageForm;window.editPackage=editPackage;window.savePackage=savePackage;window.resetPackage=resetPackage;window.deletePackage=deletePackage;window.createKey=createKey;window.clearKeys=clearKeys;window.toggleBan=toggleBan;window.deleteKey=deleteKey;window.openKey=openKey;window.closeKey=closeKey;window.saveNote=saveNote;window.setUid=setUid;window.sendMsg=sendMsg;window.banUid=banUid;window.unbanUid=unbanUid;

window.addEventListener("error", function(e){
  const a=document.getElementById("app");
  if(a) a.insertAdjacentHTML("afterbegin", `<div style="position:fixed;left:12px;right:12px;bottom:12px;z-index:9999;background:#fff1f2;color:#991b1b;border:1px solid #fecdd3;border-radius:12px;padding:12px;font:13px Arial">Lỗi JavaScript: ${esc(e.message||"Không xác định")}</div>`);
});
try { render(); setStatus(false,"Đang đọc Firebase…"); syncFromFirebase(false); }
catch(e){ const a=document.getElementById("app"); if(a) a.insertAdjacentHTML("afterbegin", `<div style="position:fixed;left:12px;right:12px;top:12px;z-index:9999;background:#fff1f2;color:#991b1b;border:1px solid #fecdd3;border-radius:12px;padding:12px;font:13px Arial">Không thể khởi chạy giao diện: ${esc(e.message||"Lỗi không xác định")}</div>`); }
</script>
</body>
</html>
